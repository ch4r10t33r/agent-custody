# Builds the log server image from deploy/Dockerfile and pushes it to GitHub Container Registry, for amd64 and arm64.
# Runs on a version tag (v0.3.0 builds from the published npm package of that version) or by hand from the Actions
# tab with a version. Uses the repository's own token; no personal token is involved. The first push creates the
# package as private: make it public once in the package's settings so `docker pull` needs no login.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "published @agent-custody/receipts version to build, e.g. 0.3.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: AGENT_CUSTODY_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-custody-log:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agent-custody-log:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=agent-custody reference log server
            org.opencontainers.image.licenses=Apache-2.0
