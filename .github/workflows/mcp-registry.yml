# Publishes packages/receipts/server.json to the official MCP Registry as io.github.svayatta/agent-custody.
# Run it by hand from the Actions tab after the npm release that server.json names: the registry checks that the
# published @agent-custody/receipts carries the matching mcpName. GitHub OIDC grants io.github.<repository owner>/*,
# so no token or secret is involved, and org publishing does not depend on anyone's personal org-role lookup.
name: mcp-registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: packages/receipts
        run: ../../mcp-publisher publish server.json
      - name: Show the listing
        run: curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.svayatta/agent-custody"
