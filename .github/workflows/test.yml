# Typecheck and test every package on each push and pull request. The Python suite and the language examples need
# their toolchains; this runs the TypeScript packages, which include the sidecar tests and the Python-free examples.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - uses: astral-sh/setup-uv@v7
      - run: bun run test:python
